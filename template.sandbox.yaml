Transform: AWS::Serverless-2016-10-31
Description: >-
  TechModa AI Capstone — TEMPLATE DE BOOTSTRAP (deploy rápido). S00 base +
  S01/S02 Rekognition, S03 Comprehend, S05 Polly, S10 gobernanza. SIN CloudFront
  a propósito: levanta el entorno en ~2-3 min. El frontend (S3+CloudFront) vive en
  template.yaml / template.full.yaml; acá no hace falta porque las features se
  prueban por Function URL. Para las features de Bedrock/Translate usá
  template.full.yaml. IAM: cada Lambda declara sus Policies y SAM le crea un rol
  de mínimo privilegio (ver docs/IAM.md).

Globals:
  Function:
    # Boundary obligatorio: la policy de deploy de los workspaces solo permite
    # iam:CreateRole si el rol nace con este permissions boundary (techo de permisos).
    PermissionsBoundary: arn:aws:iam::281248178297:policy/techmoda-capstone-boundary
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs22.x
    Tracing: Active
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable

Resources:
  # ---- S00 · base: catálogo CRUD (router + Function URL) + DynamoDB ----
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-Products
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-Router
      Description: Router CRUD de /products via Lambda Function URL (sandbox-compatible)
      CodeUri: functions/
      Handler: router/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---- S01 · Rekognition DetectLabels ----
  EnrichLabelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-EnrichLabels
      Description: S1 - Auto-etiquetado de imagenes de producto (Rekognition DetectLabels)
      CodeUri: sessions/S01-rekognition-labels/functions/enrich-labels
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # Las APIs Detect* de Rekognition no admiten ARN -> acotamos por acción.
        - Statement:
            - Effect: Allow
              Action: rekognition:DetectLabels
              Resource: "*"
        # Si imageUrl es s3://, Rekognition lee el objeto con ESTE rol.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-*/*
      Environment:
        Variables:
          LABEL_MIN_CONFIDENCE: "80"
          LABEL_MAX_LABELS: "15"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---- S02 · Rekognition DetectModerationLabels + alt-text ----
  ModerateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ModerateImage
      Description: S2 - Moderacion de imagen + alt-text accesible (Rekognition)
      CodeUri: sessions/S02-moderation-alttext/functions/moderate-image
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectModerationLabels
                - rekognition:DetectLabels
              Resource: "*"
        # Si imageUrl es s3://, Rekognition lee el objeto con ESTE rol.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-*/*
      Environment:
        Variables:
          MODERATION_MIN_CONFIDENCE: "60"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---- S03 · Comprehend DetectSentiment ----
  AnalyzeSentimentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-AnalyzeSentiment
      Description: S3 - Sentimiento de resenas (Amazon Comprehend)
      CodeUri: sessions/S03-comprehend-sentiment/functions/analyze-sentiment
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action: comprehend:DetectSentiment
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---- S05 · Polly SynthesizeSpeech (+ bucket de audio efímero) ----
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-audio
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAudio
            Status: Enabled
            ExpirationInDays: 7

  SynthesizeVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SynthesizeVoice
      Description: S5 - Descripcion por voz / accesibilidad (Amazon Polly)
      CodeUri: sessions/S05-polly-voice/functions/synthesize-voice
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
        # Escribe el mp3 y firma la URL prefirmada con este rol -> Crud.
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Environment:
        Variables:
          AUDIO_BUCKET: !Ref AudioBucket
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  # ---- S10 · gobernanza: log group de invocación ----
  # (La alarma de billing no la crea este stack — métrica AWS/Billing, se crea a mano en consola/Budgets; ver GUIA de S10.)
  BedrockInvocationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /techmoda/${AWS::StackName}/bedrock-invocations
      RetentionInDays: 30
  # ---- S07 bedrock RAG busqueda ----
   IndexEmbeddingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-IndexEmbeddings
      Description: S7 - Construye el indice de embeddings del catalogo (Bedrock Titan)
      CodeUri: sessions/S07-bedrock-rag-busqueda/functions/index-embeddings
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # Bedrock SI admite ARN de recurso -> acotamos al modelo, no a bedrock:*.
        # inference-profile cubre los IDs con prefijo "us." (perfiles cross-region).
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
      Timeout: 120   # recorre todo el catalogo
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

  SemanticSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SemanticSearch
      Description: S7 - Busqueda semantica del catalogo (Bedrock Titan)
      CodeUri: sessions/S07-bedrock-rag-busqueda/functions/semantic-search
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
        # Bedrock SI admite ARN de recurso -> acotamos al modelo, no a bedrock:*.
        # inference-profile cubre los IDs con prefijo "us." (perfiles cross-region).
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
      Timeout: 60
      Environment:
        Variables:
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          SEARCH_TOP_K: "5"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]

Outputs:
  ApiUrl:
    Description: Base API URL (Function URL del router CRUD). Termina en '/'.
    Value: !GetAtt RouterFunctionUrl.FunctionUrl
  EnrichLabelsUrl:
    Description: S1 Function URL
    Value: !GetAtt EnrichLabelsFunctionUrl.FunctionUrl
  ModerateImageUrl:
    Description: S2 Function URL
    Value: !GetAtt ModerateImageFunctionUrl.FunctionUrl
  AnalyzeSentimentUrl:
    Description: S3 Function URL
    Value: !GetAtt AnalyzeSentimentFunctionUrl.FunctionUrl
  SynthesizeVoiceUrl:
    Description: S5 Function URL
    Value: !GetAtt SynthesizeVoiceFunctionUrl.FunctionUrl
  ProductsTableName:
    Description: Tabla DynamoDB de productos
    Value: !Ref ProductsTable
  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
