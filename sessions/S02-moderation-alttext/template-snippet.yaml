# ============================================================================
# S2 · Rekognition DetectModerationLabels + alt-text  —  pegar en template.yaml
# ============================================================================
# Patrón: Function URL propia (sin API Gateway) + `Policies:` de mínimo privilegio
# (SAM crea el rol). Ver docs/IAM.md.
# Ver docs/SANDBOX-COMPAT.md.
# ----------------------------------------------------------------------------


ModerateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ModerateImage
      Description: S2 - Moderacion de imagen + alt-text accesible (Rekognition)
      CodeUri: sessions/S02-moderation-alttext/functions/moderate-image
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectModerationLabels
                - rekognition:DetectLabels
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-*/*
      Environment:
        Variables:
          MODERATION_MIN_CONFIDENCE: "60"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [ "*" ]
          AllowMethods: [ "*" ]
          AllowHeaders: [ "*" ]-----------------------------------------------
# FUNCTION URL — Outputs:
#   ModerateImageUrl:
#     Value: !GetAtt ModerateImageFunctionUrl.FunctionUrl
#
# Invocación (id por path o body):
#   curl -X POST "${URL%/}/products/<PRODUCT_ID>/moderate"
#
# Permisos concedidos: rekognition:DetectModerationLabels + DetectLabels y s3:GetObject.
# ----------------------------------------------------------------------------
